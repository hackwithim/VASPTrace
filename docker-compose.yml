version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vasptrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vasptrace
      POSTGRES_PASSWORD: vasptrace_secure_pass
      POSTGRES_DB: vasptrace_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vasptrace -d vasptrace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.18-community
    container_name: vasptrace-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/vasptrace_graph_secret
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p vasptrace_graph_secret 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vasptrace-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: vasptrace-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_NAME=VASPTrace
      - DATABASE_URL=postgresql://vasptrace:vasptrace_secure_pass@postgres:5432/vasptrace_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=vasptrace_graph_secret
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=super-secret-investigator-key-change-in-production-2026-sih
      - MOCK_MODE=true
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: vasptrace-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
